<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Absensi Otomatis</title>
    <!-- Memuat Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat SheetJS untuk fitur Export Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Font Inter dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Animasi sederhana untuk notifikasi */
        @keyframes slideIn {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-animate {
            animation: slideIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 sm:p-8 text-slate-800">

    <div class="max-w-5xl mx-auto">
        <!-- Notifikasi (Toast) -->
        <div id="toastMessage" class="hidden fixed top-4 left-1/2 transform -translate-x-1/2 z-50 min-w-[300px] shadow-lg rounded-xl p-4 border toast-animate" role="alert">
            <div class="flex items-center gap-3">
                <div id="toastIcon"></div>
                <div>
                    <strong class="font-bold block text-sm" id="toastTitle">Berhasil!</strong>
                    <span class="block text-sm" id="toastText">Data berhasil diproses.</span>
                </div>
            </div>
        </div>

        <!-- Header & Kontrol -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 mb-6">
            <div class="flex items-center gap-4 mb-2">
                <div class="bg-blue-100 p-3 rounded-xl text-blue-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">Generator Absensi Otomatis</h1>
                    <p class="text-slate-500 text-sm mt-1">Dukung Kalender Dinamis Hingga Tahun 2100</p>
                </div>
            </div>
            
            <hr class="my-6 border-slate-100">

            <div class="flex flex-col sm:flex-row gap-4 items-end">
                <div class="w-full sm:w-1/3">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Pilih Bulan</label>
                    <select id="inputBulan" class="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all cursor-pointer">
                        <option value="0">Januari</option>
                        <option value="1">Februari</option>
                        <option value="2">Maret</option>
                        <option value="3">April</option>
                        <option value="4">Mei</option>
                        <option value="5">Juni</option>
                        <option value="6">Juli</option>
                        <option value="7">Agustus</option>
                        <option value="8">September</option>
                        <option value="9">Oktober</option>
                        <option value="10">November</option>
                        <option value="11">Desember</option>
                    </select>
                </div>
                <div class="w-full sm:w-1/3">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Tahun (Hingga 2100)</label>
                    <select id="inputTahun" class="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all cursor-pointer">
                        <!-- Opsi tahun akan dimuat otomatis oleh JavaScript -->
                    </select>
                </div>
                <div class="w-full sm:w-1/3 flex gap-3">
                    <button onclick="generateAbsen()" class="flex-1 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-xl p-3 transition-colors shadow-sm">
                        Proses
                    </button>
                    <button onclick="exportExcel()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold rounded-xl p-3 transition-colors shadow-sm flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                        Unduh
                    </button>
                </div>
            </div>
        </div>

        <!-- Tabel Hasil -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table id="tabelAbsen" class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-700 text-sm border-b border-slate-200">
                            <th class="p-4 font-semibold w-16 text-center">Tanggal</th>
                            <th class="p-4 font-semibold w-32">Hari</th>
                            <th class="p-4 font-semibold w-32 text-center">Jam Masuk</th>
                            <th class="p-4 font-semibold w-32 text-center">Jam Pulang</th>
                            <th class="p-4 font-semibold">Keterangan</th>
                        </tr>
                    </thead>
                    <tbody id="tabelBody" class="text-sm divide-y divide-slate-100">
                        <tr>
                            <td colspan="5" class="p-12 text-center text-slate-400">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-3 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                </svg>
                                Silakan pilih bulan dan tahun, lalu klik <strong class="text-slate-600">"Proses"</strong>.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const namaHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];

        // Format angka jadi 2 digit
        const padZero = (num) => num.toString().padStart(2, '0');

        /**
         * ALGORITMA KALENDER DINAMIS HINGGA 2100
         * Menghasilkan hari libur secara otomatis berdasarkan tahun.
         */
        function getDynamicHolidays(year) {
            const holidays = {};

            // 1. Hari Libur Tetap (Solar)
            holidays[`${year}-01-01`] = "Tahun Baru Masehi";
            holidays[`${year}-05-01`] = "Hari Buruh Internasional";
            holidays[`${year}-06-01`] = "Hari Lahir Pancasila";
            holidays[`${year}-08-17`] = "Hari Kemerdekaan RI";
            holidays[`${year}-12-25`] = "Hari Raya Natal";

            // 2. Perayaan Paskah (Computus Algorithm untuk Kenaikan & Wafat Isa Almasih)
            const a = year % 19;
            const b = Math.floor(year / 100);
            const c = year % 100;
            const d = Math.floor(b / 4);
            const e = b % 4;
            const f = Math.floor((b + 8) / 25);
            const g = Math.floor((b - f + 1) / 3);
            const h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4);
            const k = c % 4;
            const l = (32 + 2 * e + 2 * i - h - k) % 7;
            const m = Math.floor((a + 11 * h + 22 * l) / 451);
            const monthEaster = Math.floor((h + l - 7 * m + 114) / 31);
            const dayEaster = ((h + l - 7 * m + 114) % 31) + 1;
            
            const easterDate = new Date(year, monthEaster - 1, dayEaster);
            
            // Wafat Isa Almasih (Jumat Agung) -> 2 hari sebelum Paskah
            const jumatAgung = new Date(easterDate);
            jumatAgung.setDate(easterDate.getDate() - 2);
            holidays[`${year}-${padZero(jumatAgung.getMonth() + 1)}-${padZero(jumatAgung.getDate())}`] = "Wafat Isa Almasih (Jumat Agung)";
            
            // Kenaikan Isa Almasih -> 39 hari setelah Paskah
            const kenaikan = new Date(easterDate);
            kenaikan.setDate(easterDate.getDate() + 39);
            holidays[`${year}-${padZero(kenaikan.getMonth() + 1)}-${padZero(kenaikan.getDate())}`] = "Kenaikan Isa Almasih";

            // 3. Estimasi Hari Raya Hijriyah
            // Menggunakan patokan rata-rata pergeseran ~10.875 hari/tahun Masehi dari basis 2024
            const estimateHijri = (baseDate2024Str, name, yDiff) => {
                const baseDate = new Date(baseDate2024Str);
                const shiftDays = Math.round(yDiff * 10.8755);
                baseDate.setDate(baseDate.getDate() - shiftDays);
                
                // Jika akibat pergeseran tahunnya loncat, sesuaikan +- 354 hari
                if (baseDate.getFullYear() < year) baseDate.setDate(baseDate.getDate() + 354);
                if (baseDate.getFullYear() > year) baseDate.setDate(baseDate.getDate() - 354);
                
                if (baseDate.getFullYear() === year) {
                    holidays[`${year}-${padZero(baseDate.getMonth() + 1)}-${padZero(baseDate.getDate())}`] = name;
                }
            };

            const yDiff = year - 2024;
            estimateHijri("2024-04-10", "Hari Raya Idul Fitri (Estimasi)", yDiff);
            estimateHijri("2024-04-11", "Cuti Bersama Idul Fitri (Estimasi)", yDiff);
            estimateHijri("2024-06-17", "Hari Raya Idul Adha (Estimasi)", yDiff);
            estimateHijri("2024-07-07", "Tahun Baru Islam (Estimasi)", yDiff);
            estimateHijri("2024-09-16", "Maulid Nabi Muhammad SAW (Estimasi)", yDiff);
            estimateHijri("2024-02-08", "Isra Mikraj (Estimasi)", yDiff);

            // 4. Estimasi Imlek & Nyepi (menggunakan pendekatan rata-rata bulan Februari-Maret)
            estimateHijri("2024-02-10", "Tahun Baru Imlek (Estimasi)", yDiff);
            estimateHijri("2024-03-11", "Hari Suci Nyepi (Estimasi)", yDiff);

            return holidays;
        }

        // Helper: Angka acak
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function getJamMasuk() {
            // Aturan: Maksimal 06.45 AM
            // Dibuat acak antara 06.00 hingga 06.45
            let jam = 6;
            let menit = getRandomInt(0, 45); 
            return `${padZero(jam)}:${padZero(menit)}`;
        }

        function getJamPulang(indeksHari) {
            // indeksHari: 1(Senin) - 6(Sabtu)
            if (indeksHari >= 1 && indeksHari <= 4) {
                // Senin - Kamis: Minimal 15.00
                let jam = 15;
                // Acak antara 15.00 hingga 16.30
                let extraMenit = getRandomInt(0, 90);
                jam += Math.floor(extraMenit / 60);
                let menit = extraMenit % 60;
                return `${padZero(jam)}:${padZero(menit)}`;
            } else if (indeksHari === 5) {
                // Jumat: Minimal 12.00
                let jam = 12;
                // Acak antara 12.00 hingga 13.30
                let extraMenit = getRandomInt(0, 90);
                jam += Math.floor(extraMenit / 60);
                let menit = extraMenit % 60;
                return `${padZero(jam)}:${padZero(menit)}`;
            } else if (indeksHari === 6) {
                // Sabtu: Minimal 14.00
                let jam = 14;
                // Acak antara 14.00 hingga 15.30
                let extraMenit = getRandomInt(0, 90);
                jam += Math.floor(extraMenit / 60);
                let menit = extraMenit % 60;
                return `${padZero(jam)}:${padZero(menit)}`;
            }
            return "-";
        }

        function showToast(title, message, type = 'success') {
            const toast = document.getElementById("toastMessage");
            const toastTitle = document.getElementById("toastTitle");
            const toastText = document.getElementById("toastText");
            const toastIcon = document.getElementById("toastIcon");

            toastTitle.innerText = title;
            toastText.innerText = message;

            // Styling based on type
            if (type === 'success') {
                toast.className = "fixed top-4 left-1/2 transform -translate-x-1/2 z-50 min-w-[300px] shadow-lg rounded-xl p-4 border toast-animate bg-emerald-50 border-emerald-200 text-emerald-800";
                toastIcon.innerHTML = `<svg class="w-6 h-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            } else {
                toast.className = "fixed top-4 left-1/2 transform -translate-x-1/2 z-50 min-w-[300px] shadow-lg rounded-xl p-4 border toast-animate bg-red-50 border-red-200 text-red-800";
                toastIcon.innerHTML = `<svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            }

            toast.classList.remove("hidden");
            
            // Hide after 3.5 seconds
            setTimeout(() => {
                toast.classList.add("hidden");
            }, 3500);
        }

        function generateAbsen() {
            const bulan = parseInt(document.getElementById("inputBulan").value);
            const tahun = parseInt(document.getElementById("inputTahun").value);
            
            if (isNaN(tahun) || tahun < 2000 || tahun > 2100) {
                showToast("Error Validasi", "Tahun harus berada di antara 2000 dan 2100.", "error");
                return;
            }

            // Generate library libur dinamis berdasarkan tahun input
            const hariLibur = getDynamicHolidays(tahun);

            const jumlahHari = new Date(tahun, bulan + 1, 0).getDate();
            const tbody = document.getElementById("tabelBody");
            
            tbody.innerHTML = "";

            for (let tgl = 1; tgl <= jumlahHari; tgl++) {
                let dateObj = new Date(tahun, bulan, tgl);
                let hariIndex = dateObj.getDay();
                let tglFormat = `${tahun}-${padZero(bulan + 1)}-${padZero(tgl)}`;
                
                let jamMasuk = "-";
                let jamPulang = "-";
                let keterangan = "";
                let isLibur = false;
                
                let rowBgClass = "hover:bg-slate-50";
                let badgeClass = "bg-blue-100 text-blue-700 border-blue-200";

                // Pengecekan status libur
                if (hariLibur[tglFormat]) {
                    isLibur = true;
                    keterangan = `Libur - ${hariLibur[tglFormat]}`;
                    badgeClass = "bg-rose-100 text-rose-700 border-rose-200";
                    rowBgClass = "bg-rose-50/30";
                } 
                else if (hariIndex === 0) { // Minggu
                    isLibur = true;
                    keterangan = "Libur Akhir Pekan (Minggu)";
                    badgeClass = "bg-amber-100 text-amber-700 border-amber-200";
                    rowBgClass = "bg-amber-50/30";
                } 
                else { // Hari Kerja
                    jamMasuk = getJamMasuk();
                    jamPulang = getJamPulang(hariIndex);
                    keterangan = "Hadir";
                }

                const tr = document.createElement("tr");
                tr.className = `${rowBgClass} transition-colors`;
                tr.innerHTML = `
                    <td class="p-4 text-center font-bold text-slate-800">${tgl}</td>
                    <td class="p-4 text-slate-600 font-medium">${namaHari[hariIndex]}</td>
                    <td class="p-4 text-center font-mono ${isLibur ? 'text-slate-400' : 'text-slate-800 font-semibold'}">${jamMasuk}</td>
                    <td class="p-4 text-center font-mono ${isLibur ? 'text-slate-400' : 'text-slate-800 font-semibold'}">${jamPulang}</td>
                    <td class="p-4">
                        <span class="inline-block px-3 py-1 rounded-lg text-xs font-semibold border ${badgeClass}">
                            ${keterangan}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            }

            showToast("Berhasil!", `Data absensi bulan ${document.getElementById("inputBulan").options[bulan].text} ${tahun} selesai dibuat.`);
        }

        function exportExcel() {
            const table = document.getElementById("tabelAbsen");
            
            const rowCount = table.rows.length;
            if (rowCount <= 2 && table.rows[1].cells.length === 1) {
                showToast("Data Kosong", "Silakan klik tombol Proses terlebih dahulu sebelum mengunduh.", "error");
                return;
            }

            const bulanSelect = document.getElementById("inputBulan");
            const namaBulan = bulanSelect.options[bulanSelect.selectedIndex].text;
            const tahun = document.getElementById("inputTahun").value;
            const fileName = `Data_Absen_${namaBulan}_${tahun}.xlsx`;

            // Proses export
            const wb = XLSX.utils.table_to_book(table, {sheet: "Data Absensi"});
            XLSX.writeFile(wb, fileName);
            showToast("Unduhan Berhasil", "File Excel telah diunduh ke perangkat Anda.");
        }

        // Set default bulan saat ini saat halaman pertama dimuat
        window.onload = function() {
            const now = new Date();
            
            // Populate dropdown tahun dari 2000 hingga 2100
            const inputTahun = document.getElementById("inputTahun");
            for (let i = 2000; i <= 2100; i++) {
                const option = document.createElement("option");
                option.value = i;
                option.textContent = i;
                inputTahun.appendChild(option);
            }

            document.getElementById("inputBulan").value = now.getMonth();
            document.getElementById("inputTahun").value = now.getFullYear();
        };
    </script>
</body>
</html>
